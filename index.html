
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b22">
  <title>Fly ASH</title>

  <style>
    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --ink: #18372a;
      --muted: #6c7b73;
      --green: #26734d;
      --line: #e2e9e4;
      --amber: #b7791f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      background: #142b22;
      color: white;
      padding: 18px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 900px;
      margin: auto;
    }

    .logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 12px;
      background: white;
      padding: 4px;
      flex: 0 0 54px;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: .5px;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 12px;
      color: #c7d9cf;
    }

    main {
      width: min(900px, 100%);
      margin: auto;
      padding: 16px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .topline h2 {
      margin: 0;
      font-size: 18px;
    }

    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .updated {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px;
      min-width: 0;
      box-shadow: 0 2px 8px #18372a08;
    }

    .supplier-name {
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
      margin-bottom: 14px;
    }

    .metric-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .metric {
      font-size: clamp(20px, 5vw, 27px);
      font-weight: 800;
      margin-bottom: 13px;
      overflow-wrap: anywhere;
    }

    .metric.actual { color: var(--green); }

    .remaining {
      border-top: 1px solid var(--line);
      padding-top: 11px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .section {
      margin-top: 20px;
    }

    .section h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    th {
      background: #edf3ef;
      font-size: 11px;
      text-transform: uppercase;
    }

    tr:last-child td { border-bottom: 0; }

    .status {
      padding: 12px;
      background: white;
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .error { color: #a52b2b; }
    .empty { text-align: center; color: var(--muted); padding: 22px; }

    @media (max-width: 520px) {
      main { padding: 12px; }
      .summary { gap: 8px; }
      .card { padding: 12px; border-radius: 13px; }
      .supplier-name { font-size: 14px; min-height: 34px; }
      .metric-label { font-size: 11px; }
      .remaining { font-size: 12px; }
      header { padding: 14px 12px; }
      .logo { width: 48px; height: 48px; flex-basis: 48px; }
      .brand h1 { font-size: 21px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <!-- Đặt logo-fly-ash.jpg cùng thư mục với Index.html trên GitHub Pages -->
      <img class="logo"
           src="logo-fly-ash.jpg"
           alt="Logo Fly ASH"
           onerror="this.style.display='none'">
      <div>
        <h1>Fly ASH</h1>
        <p>THEO DÕI KẾ HOẠCH VÀ KHỐI LƯỢNG CUNG CẤP</p>
      </div>
    </div>
  </header>

  <main>
    <div class="topline">
      <h2>Tổng quan cung cấp</h2>
      <button onclick="loadData()">↻ Làm mới</button>
    </div>

    <div id="status" class="status">Đang tải dữ liệu Google Sheets…</div>
    <div id="updated" class="updated"></div>
    <div id="summary" class="summary"></div>

    <section class="section">
      <h2>Danh sách chuyến xe</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Biển số xe</th>
              <th>Nhà cung cấp</th>
              <th>Bắt đầu</th>
              <th>Kết thúc</th>
              <th>Khối lượng</th>
            </tr>
          </thead>
          <tbody id="deliveryRows">
            <tr><td colspan="5" class="empty">Đang tải…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Thay bằng URL Web app Apps Script sau khi triển khai.
    const API_URL = 'DAN_URL_WEB_APP_APPS_SCRIPT_VAO_DAY';

    function fmt(value) {
      if (value === null || value === undefined || value === '') {
        return '—';
      }

      const n = Number(value);
      return Number.isFinite(n)
        ? n.toLocaleString('vi-VN', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          })
        : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(c) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[c];
      });
    }

    function loadData() {
      const status = document.getElementById('status');

      if (!API_URL || API_URL.indexOf('DAN_URL_') === 0) {
        status.textContent =
          'Anh cần thay API_URL bằng URL Web app Apps Script.';
        status.className = 'status error';
        return;
      }

      status.textContent = 'Đang tải dữ liệu…';
      status.className = 'status';

      const callbackName = 'flyAshCallback_' + Date.now();
      const script = document.createElement('script');
      const timeout = setTimeout(function() {
        cleanup();
        status.textContent =
          'Không nhận được dữ liệu. Kiểm tra URL và quyền truy cập Apps Script.';
        status.className = 'status error';
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = function(data) {
        cleanup();

        if (!data || !data.ok) {
          status.textContent = data && data.error
            ? data.error : 'Không đọc được dữ liệu.';
          status.className = 'status error';
          return;
        }

        render(data);
        status.textContent = 'Dữ liệu đã được cập nhật.';
        status.className = 'status';
      };

      script.onerror = function() {
        cleanup();
        status.textContent = 'Lỗi kết nối Apps Script.';
        status.className = 'status error';
      };

      script.src = API_URL +
        (API_URL.indexOf('?') >= 0 ? '&' : '?') +
        'callback=' + encodeURIComponent(callbackName) +
        '&t=' + Date.now();

      document.body.appendChild(script);
    }

    function render(data) {
      document.getElementById('updated').textContent =
        'Cập nhật lúc: ' + (data.updatedAt || '—');

      const suppliers = data.suppliers || [];

      document.getElementById('summary').innerHTML = suppliers.map(function(s) {
        return `
          <article class="card">
            <div class="supplier-name">${escapeHtml(s.name)}</div>
            <div class="metric-label">Kế hoạch</div>
            <div class="metric">${fmt(s.plan)} tấn</div>
            <div class="metric-label">Đã cung cấp</div>
            <div class="metric actual">${fmt(s.actual)} tấn</div>
            <div class="remaining">
              <span>Còn lại</span>
              <strong>${fmt(s.remaining)} tấn</strong>
            </div>
          </article>`;
      }).join('');

      const deliveries = data.deliveries || [];
      const body = document.getElementById('deliveryRows');

      if (!deliveries.length) {
        body.innerHTML =
          '<tr><td colspan="5" class="empty">Chưa có dữ liệu chuyến xe.</td></tr>';
        return;
      }

      body.innerHTML = deliveries.map(function(d) {
        return `<tr>
          <td>${escapeHtml(d.plate)}</td>
          <td>${escapeHtml(d.supplier)}</td>
          <td>${escapeHtml(d.startTime)}</td>
          <td>${escapeHtml(d.endTime)}</td>
          <td>${escapeHtml(d.tonnes)}</td>
        </tr>`;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
